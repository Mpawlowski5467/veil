name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pyright src

  build:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv build
      - name: Install the wheel alone and run the README example
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          from veil import Shield
          shield = Shield()
          shield.add_entity("Jan Nowak", "PERSON")
          masked = shield.mask("Email Jan Nowak at jan.n@example.com about the invoice.")
          assert masked.text == "Email [PERSON_1] at [EMAIL_1] about the invoice.", masked
          restored = shield.restore("Hi [PERSON_1], following up on the invoice...")
          assert restored.text == "Hi Jan Nowak, following up on the invoice...", restored
          print("ok")
          EOF
      - name: Install desktop extra and smoke-test setup, status, and undo
        run: |
          for wheel in dist/*.whl; do
            uv pip install --python /tmp/smoke/bin/python "${wheel}[desktop]"
          done
          /tmp/smoke/bin/python - <<'EOF'
          import tempfile
          from pathlib import Path
          from veil import Shield
          from veil.cli import main
          from veil.gateway import Gateway, Sessions

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              data = root / "veil"
              config = root / "codex" / "config.toml"
              data.mkdir(mode=0o700)
              (data / "gateway-secret").write_text("fictional-smoke-secret")
              with Gateway(Sessions(lambda _: Shield(), api="openai"),
                           secret="fictional-smoke-secret", api="openai",
                           openai_auth="chatgpt") as gateway:
                  assert main(["--data-dir", str(data), "setup", "codex",
                               "--config", str(config), "--port", str(gateway.port)]) == 0
                  assert main(["status", "--config", str(config)]) == 0
                  assert main(["undo", "codex", "--config", str(config)]) == 0
                  assert not config.exists()
          EOF
