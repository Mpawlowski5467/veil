name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pyright src

  build:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv build
      - name: Install the wheel alone and run the README example
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import importlib.util
          from veil import Shield
          assert importlib.util.find_spec("tomlkit") is None
          shield = Shield()
          shield.add_entity("Jan Nowak", "PERSON")
          masked = shield.mask("Email Jan Nowak at jan.n@example.com about the invoice.")
          assert masked.text == "Email [PERSON_1] at [EMAIL_1] about the invoice.", masked
          restored = shield.restore("Hi [PERSON_1], following up on the invoice...")
          assert restored.text == "Hi Jan Nowak, following up on the invoice...", restored
          print("ok")
          EOF
      - name: Smoke-test bundled skill from the installed wheel
        run: |
          /tmp/smoke/bin/python - <<'EOF'
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          from veil.cli import main

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              assert main(["skill", "install", "codex", "--skills-dir", tmp]) == 0
              text = (root / "veil" / "runtime.md").read_text()
              argv = json.loads(text.split("```json\n", 1)[1].split("\n```", 1)[0])
              subprocess.run([*argv, "--help"], cwd=tmp, check=True)
              assert (root / "veil" / "SKILL.md").is_file()
              assert main(["skill", "uninstall", "codex", "--skills-dir", tmp]) == 0
              assert not (root / "veil").exists()
          EOF
      - name: Smoke-test background controls without desktop dependencies
        run: |
          /tmp/smoke/bin/python - <<'EOF'
          import contextlib
          import io
          import json
          import socket
          import tempfile
          from pathlib import Path
          from veil.service import run_service, service_status
          from veil.cli import main

          with tempfile.TemporaryDirectory() as tmp:
              data = Path(tmp) / "veil"
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  port = sock.getsockname()[1]
              try:
                  assert run_service("start", data_dir=data,
                                     api="anthropic", port=port) == 0
                  assert service_status(data)["state"] == "running"
                  output = io.StringIO()
                  options = ["--data-dir", str(data)]
                  endpoint = ["--gateway-url", f"http://127.0.0.1:{port}"]
                  with contextlib.redirect_stdout(output):
                      assert main([*options, "verify", *endpoint, "--json"]) == 0
                  probe = json.loads(output.getvalue())
                  assert probe["state"] == "pending"
                  assert main([*options, "verify", *endpoint,
                               "--check", probe["verification_id"]]) == 1
                  assert main([*options, "status", "--activity", *endpoint]) == 0
              finally:
                  run_service("stop", data_dir=data, remove=True)
          EOF
      - name: Install desktop extra and smoke-test setup, background status, and undo
        run: |
          for wheel in dist/*.whl; do
            uv pip install --python /tmp/smoke/bin/python "${wheel}[desktop]"
          done
          /tmp/smoke/bin/python - <<'EOF'
          import tempfile
          import socket
          from pathlib import Path
          from veil.cli import main
          from veil.service import run_service

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              data = root / "veil"
              config = root / "codex" / "config.toml"
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  port = sock.getsockname()[1]
              try:
                  assert main(["--data-dir", str(data), "setup", "codex",
                               "--config", str(config), "--port", str(port)]) == 0
                  assert run_service("start", config=config) == 0
                  assert main(["status", "--config", str(config)]) == 0
              finally:
                  run_service("stop", data_dir=data, remove=True)
              assert main(["undo", "codex", "--config", str(config)]) == 0
              assert not config.exists()
          EOF

  native:
    name: Native workflows (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Native storage, CLI, setup, recovery, and protocol regressions
        run: >-
          uv run pytest -q tests/test_platform_workflows.py
          tests/test_verification.py tests/test_gateway_response.py
          tests/test_gateway_request.py tests/test_gateway_blocks.py
          tests/test_gateway_golden.py tests/test_gateway_leaks.py
          tests/test_gateway_request_fuzz.py tests/test_openai_gateway.py
          tests/test_ssn.py tests/test_secrets.py tests/test_shield.py tests/test_regex_detector.py tests/test_manual_detector.py
          tests/test_masker.py tests/test_restorer.py tests/test_stream.py
          tests/test_fuzz.py tests/test_readme.py
      - name: Install native Linux clipboard tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xclip xvfb
      - name: Native clipboard (macOS and Windows)
        if: runner.os != 'Linux'
        run: uv run pytest -q tests/test_platform_workflows.py -k clipboard
        env:
          VEIL_NATIVE_CLIPBOARD: "1"
      - name: Native clipboard (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -q tests/test_platform_workflows.py -k clipboard
        env:
          VEIL_NATIVE_CLIPBOARD: "1"
      - run: uv build
      - run: uv run python benchmarks/wheel_smoke.py

  upgrade:
    name: Upgrade and rollback from 0.4.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv build
      - uses: actions/checkout@v7
        with:
          ref: v0.4.1
          path: .previous-release
      - run: uv build .previous-release --out-dir /tmp/veil-previous-dist
      - run: |
          uv venv /tmp/veil-previous-env
          uv venv /tmp/veil-current-env
          uv pip install --python /tmp/veil-previous-env/bin/python /tmp/veil-previous-dist/*.whl
          uv pip install --python /tmp/veil-current-env/bin/python dist/*.whl
          uv run python benchmarks/upgrade.py --previous-python /tmp/veil-previous-env/bin/python --current-python /tmp/veil-current-env/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: veil-distributions
          path: dist/*
          if-no-files-found: error
