name: Beta feedback
description: A short report about your Veil setup and local check. Client testing is optional.
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: |
        Start with the [beta guide](https://github.com/Mpawlowski5467/veil/blob/main/beta/README.md) and [0.6.0b2 release](https://github.com/Mpawlowski5467/veil/releases/tag/v0.6.0b2). The local check makes no model calls; optional client exercises use your normal quota or API charges.

        This issue is public. Share only feedback using fictional examples and, optionally, `beta-check.json`. Do not upload the used pack/workspace, `beta-data`, configuration files, vaults, credentials, or transcripts.

        For a possible security problem, use the [private security form](https://github.com/Mpawlowski5467/veil/security/advisories/new).
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (native)
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions, if known
      description: Veil, Python, OS version, and client version if you used one. Leave unknown versions out.
      placeholder: "Veil 0.6.0b2; Python 3.14; Windows 11; Claude Code ..."
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Pass
        - Fail
        - Not tried
    validations:
      required: true
  - type: dropdown
    id: local_check
    attributes:
      label: Local check (check.py)
      description: Pass means all five checks passed. You can attach beta-check.json below.
      options:
        - Pass
        - Fail
        - Not tried
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client, if tried
      options:
        - Not tried — local check only
        - Claude Code
        - Codex CLI
        - Codex desktop
        - Other
  - type: dropdown
    id: auth
    attributes:
      label: Client sign-in, if tried
      description: Choose the route only. Never include account details or keys.
      options:
        - Not tried / unsure
        - Claude — signed-in account
        - Claude — API key
        - Codex — ChatGPT sign-in
        - Codex — OpenAI API key
        - Other
  - type: dropdown
    id: client_result
    attributes:
      label: Client verification, if tried
      description: Pass means Veil reported verified after you sent its generated prompt and checked the result. An echoed email alone is not verification.
      options:
        - Pass
        - Fail
        - Not tried
  - type: textarea
    id: experience
    attributes:
      label: What worked or got confusing?
      description: A few sentences are enough. For a failure, include the guide step and what happened, using fictional examples. Optionally attach beta-check.json here.
      placeholder: "Everything passed, or: I got stuck at step ..."
  - type: input
    id: time_help
    attributes:
      label: Time and help needed
      placeholder: "About 10 minutes; no help needed. Or: needed help with ..."
