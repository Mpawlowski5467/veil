[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veil"
dynamic = ["version"]
description = "Reversible PII masking for LLM calls: mask before the prompt, restore after the reply."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mateusz Pawlowski" }]
keywords = ["pii", "privacy", "llm", "masking", "redaction", "anonymization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
desktop = ["tomlkit>=0.13.3,<1"]

[project.scripts]
veil = "veil.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.6",
    "tomlkit>=0.13.3,<1",
]

[tool.hatch.version]
path = "src/veil/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--doctest-modules"]
filterwarnings = ["error"]
markers = [
    "live: opt-in tests that make real model calls through Claude Code or Codex",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
